[project]
name = "payout-gateway"
version = "0.1.0"
description = ""
authors = [
    {name = "Alexey Kozlouskiy",email = "bylba4kaa@gmail.com"}
]
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "uvicorn[standard] (>=0.53.0,<0.54.0)",
    "sqlalchemy[asyncio] (>=2.0.54,<3.0.0)",
    "asyncpg (>=0.31.0,<0.32.0)",
    "alembic (>=1.20.0,<2.0.0)",
    "pydantic-settings (>=2.15.0,<3.0.0)",
    "httpx (>=0.28.1,<0.29.0)",
    "fastapi (>=0.141.1,<0.142.0)",
    "mypy (>=2.3.1,<3.0.0)"
]


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[dependency-groups]
dev = [
    "pytest (>=9.1.1,<10.0.0)",
    "pytest-asyncio (>=1.4.0,<2.0.0)",
    "ruff (>=0.16.8,<0.17.0)"
]


[project.scripts]
payout_gateway = "payout_gateway.cli:main"

[tool.poetry]
packages = [{ include = "payout_gateway" }]
